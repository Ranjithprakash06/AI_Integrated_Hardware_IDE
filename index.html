function showPopup(
    message,
    type="error"
){

    const popup =
        document.createElement("div");


    popup.className =
        "popup-enter text-white p-4 " +
        "rounded-lg shadow-xl " +
        "flex items-start gap-3 " +
        "border-l-4";


    if(type === "error"){

        popup.classList.add(
            "bg-red-900/90",
            "border-red-500"
        );

    }
    else if(type === "success"){

        popup.classList.add(
            "bg-emerald-900/90",
            "border-emerald-500"
        );

    }
    else{

        popup.classList.add(
            "bg-amber-900/90",
            "border-amber-500"
        );
    }


    const icon =
        document.createElement("div");

    icon.className =
        "text-2xl";

    icon.textContent =
        type === "error"
            ? "⚠️"
            : type === "success"
                ? "✅"
                : "ℹ️";


    const body =
        document.createElement("div");

    body.className =
        "flex-1";


    const title =
        document.createElement("p");

    title.className =
        "font-semibold";

    title.textContent =
        type === "error"
            ? "Error"
            : type === "success"
                ? "Success"
                : "Information";


    const text =
        document.createElement("p");

    text.className =
        "text-sm mt-1";

    text.textContent =
        message;


    body.append(
        title,
        text
    );


    const close =
        document.createElement("button");

    close.className =
        "text-white/70 hover:text-white";

    close.textContent =
        "✕";

    close.onclick =
        () => popup.remove();


    popup.append(
        icon,
        body,
        close
    );


    popupContainer.appendChild(
        popup
    );


    setTimeout(()=>{

        if(popup.parentElement)
            popup.remove();

    },8000);
}


/* =====================================================
   FALLBACK PROJECT
====================================================== */

/*
    Gemini has a daily quota.

    If Gemini returns HTTP 429,
    this fallback allows the IDE to continue
    testing the complete pipeline.

    Current fallback specifically supports:

        LED blinking on ESP32 GPIO 2 / D2
        Serial Monitor at 115200 baud
*/

function getFallbackProject(prompt){

    const lower =
        prompt.toLowerCase();


    if(
        lower.includes("led") &&
        (
            lower.includes("d2") ||
            lower.includes("pin 2") ||
            lower.includes("gpio 2") ||
            lower.includes("gpio2")
        )
    ){

        return {

            chat_message:
                "ESP32 LED blink test on GPIO 2 (D2) with live Serial Monitor output. Gemini quota is currently unavailable, so the local fallback project was used.",

            components:[

                {
                    name:"ESP32 DevKit",
                    rank:"Recommended",
                    price:"₹400–₹700"
                },

                {
                    name:"LED",
                    rank:"Recommended",
                    price:"₹5–₹10"
                },

                {
                    name:"220Ω resistor",
                    rank:"Recommended",
                    price:"₹2–₹5"
                }

            ],

            instructions:[

                {
                    step:"1",
                    text:"Connect ESP32 GPIO 2 (D2) to the LED anode through a 220Ω resistor."
                },

                {
                    step:"2",
                    text:"Connect the LED cathode to ESP32 GND."
                },

                {
                    step:"3",
                    text:"Connect the ESP32 to the computer using USB."
                },

                {
                    step:"4",
                    text:"After uploading, open the Live Serial Monitor at 115200 baud."
                }

            ],

            cpp_code:
`#define LED_PIN 2

void setup() {

  Serial.begin(115200);

  pinMode(LED_PIN, OUTPUT);

  Serial.println("ESP32 STARTED");
  Serial.println("LED blinking on GPIO 2 / D2");

}

void loop() {

  digitalWrite(LED_PIN, HIGH);

  Serial.println("LED ON");

  delay(1000);

  digitalWrite(LED_PIN, LOW);

  Serial.println("LED OFF");

  delay(1000);

}`

        };

    }


    throw new Error(
        "Gemini quota is exhausted and no local fallback is available for this project."
    );
}


/* =====================================================
   AI REQUEST
====================================================== */

async function fetchFromAI(prompt){

    let response;

    try{

        response =
            await fetch(
                "http://localhost:5000/ask_ai",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        prompt:prompt
                    })
                }
            );

    }
    catch(error){

        throw new Error(
            "Cannot connect to the backend. Make sure Flask is running on http://localhost:5000."
        );
    }


    let data;


    try{

        data =
            await response.json();

    }
    catch{

        throw new Error(
            "Backend returned an invalid response."
        );
    }


    /*
       GEMINI QUOTA FALLBACK
    */

    if(!response.ok){

        const errorText =
            JSON.stringify(data).toLowerCase();

        if(
            response.status === 429 ||
            errorText.includes("resource_exhausted") ||
            errorText.includes("quota") ||
            errorText.includes("429")
        ){

            addChatMessage(
                "system",
                "Gemini quota is currently exhausted. Switching to local fallback mode."
            );

            return getFallbackProject(prompt);
        }


        throw new Error(
            data.error ||
            "AI request failed."
        );
    }


    if(data.error){

        const errorText =
            JSON.stringify(data).toLowerCase();

        if(
            errorText.includes("resource_exhausted") ||
            errorText.includes("quota") ||
            errorText.includes("429")
        ){

            addChatMessage(
                "system",
                "Gemini quota is currently exhausted. Switching to local fallback mode."
            );

            return getFallbackProject(prompt);
        }


        throw new Error(
            data.error
        );
    }


    if(
        !data.components ||
        !Array.isArray(data.components)
    ){

        throw new Error(
            "AI response does not contain valid components."
        );
    }


    if(
        !data.instructions ||
        !Array.isArray(data.instructions)
    ){

        throw new Error(
            "AI response does not contain valid wiring instructions."
        );
    }


    if(
        typeof data.cpp_code !== "string" ||
        !data.cpp_code.trim()
    ){

        throw new Error(
            "AI response does not contain C++ code."
        );
    }


    return data;
}

        "max-h-[500px]";

        code;

        title,
        copyButton
    );


    wrapper.append(
        toolbar,
        pre
    );


    container.append(
        heading,
        wrapper
    );


    dynamicContent.appendChild(
        container
    );
}

/* =====================================================
   COMPILE FIRMWARE
====================================================== */

async function compileFirmware(cppCode){

    const status =
        document.getElementById(
            "firmwareStatus"
        );


    if(status){

        status.textContent =
            "Compiling ESP32 firmware...";
    }


    addChatMessage(
        "system",
        "Compiling generated C++ into an ESP32 firmware binary..."
    );


    const response =
        await fetch(
            "http://localhost:5000/compile",
            {

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    cpp_code:cppCode
                })
            }
        );


    let data;


    try{

        data =
            await response.json();

    }
    catch{

        throw new Error(
            "Compiler returned an invalid response."
        );
    }


    if(
        !response.ok ||
        !data.success
    ){

        throw new Error(
            data.error ||
            "ESP32 compilation failed."
        );
    }


    if(
        !data.firmware ||
        !data.firmware.data
    ){

        throw new Error(
            "Backend compiled the code but did not return firmware data."
        );
    }


    currentProjectContext.firmware =
        data.firmware;


    currentProjectContext.firmware_base64 =
        data.firmware.data;


    if(status){

        status.textContent =
            "Compilation successful. Firmware is ready for upload.";
    }


    updateFlashButton();


    return data.firmware;
}

/* =====================================================
   CONNECT ESP32
====================================================== */

async function connectToBoard(){

    if(!("serial" in navigator)){

        showPopup(
            "Web Serial is not supported in this browser.",
            "error"
        );

        return;
    }


    try{

        /*
         * If already connected, don't request again.
         */

        if(serialPort){

            showPopup(
                "ESP32 port is already selected.",
                "info"
            );

            return;
        }


        serialStatus.textContent =
            "selecting";


        /*
         * ONLY SELECT THE PORT.
         *
         * Do not open it here.
         */

        serialPort =
            await navigator.serial.requestPort();


        serialStatus.textContent =
            "port selected";


        connectionBadge.classList.remove(
            "hidden"
        );


        connectionBadge.textContent =
            "🔵 port selected";


        connectBtn.textContent =
            "ESP32 Selected";


        connectBtn.disabled =
            true;


        connectBtn.classList.remove(
            "bg-blue-600"
        );


        connectBtn.classList.add(
            "bg-emerald-700"
        );


        addChatMessage(
            "system",
            "ESP32 COM port selected. The port will be opened when flashing."
        );


    }
    catch(error){

        console.error(error);


        serialPort =
            null;


        serialStatus.textContent =
            "disconnected";


        if(
            error.name ===
            "NotFoundError"
        ){

            addChatMessage(
                "system",
                "No serial port was selected."
            );

            return;
        }


        showPopup(
            error.message ||
            "Unable to select ESP32.",
            "error"
        );
    }
}


/* =====================================================
   OPEN SERIAL MONITOR
====================================================== */

async function openSerialMonitor(){

    if(!serialPort){

        showPopup(
            "ESP32 port is not selected.",
            "error"
        );

        return;
    }


    try{

        /*
         * Already open
         */

        if(isSerialOpen){

            return;
        }


        /*
         * Open COM port at 115200 baud
         */

        await serialPort.open({
            baudRate:115200
        });


        isSerialOpen =
            true;


        serialStatus.textContent =
            "connected";


        connectionBadge.textContent =
            "🟢 serial connected";


        connectionBadge.classList.remove(
            "hidden"
        );


        addChatMessage(
            "system",
            "ESP32 serial monitor connected at 115200 baud."
        );


        console.log(
            "Serial monitor connected at 115200 baud."
        );


        /*
         * Start reading ESP32 serial output
         */

        startSerialReader();

    }
    catch(error){

        console.error(
            "SERIAL MONITOR ERROR:",
            error
        );


        isSerialOpen =
            false;


        serialStatus.textContent =
            "error";


        showPopup(
            "Serial monitor failed: " +
            (
                error.message ||
                error
            ),
            "error"
        );
    }
}


/* =====================================================
   SERIAL READER
====================================================== */

async function startSerialReader(){

    if(
        !serialPort ||
        !serialPort.readable
    ){

        return;
    }


    try{

        const decoder =
            new TextDecoderStream();


        serialPort.readable.pipeTo(
            decoder.writable
        ).catch(
            error => {
                console.warn(
                    "Serial pipe closed:",
                    error
                );
            }
        );


        serialReader =
            decoder.readable
                .getReader();


        let buffer = "";


        while(isSerialOpen){

            const {
                value,
                done
            } =
                await serialReader.read();


            if(done)
                break;


            if(value){

                buffer += value;


                const lines =
                    buffer.split("\n");


                buffer =
                    lines.pop() || "";


                for(
                    const line of lines
                ){

                    const cleanLine =
                        line.trim();


                    if(!cleanLine)
                        continue;


                    const element =
                        document.createElement(
                            "div"
                        );


                    element.className =
                        "serial-line text-cyan-300";


                    element.textContent =
                        "> " + cleanLine;


                    serialOutput.appendChild(
                        element
                    );


                    serialOutput.scrollTop =
                        serialOutput.scrollHeight;


                    analyzeSerialLine(
                        cleanLine
                    );
                }
            }
        }

    }
    catch(error){

        if(isSerialOpen){

            console.error(
                "SERIAL READER ERROR:",
                error
            );

            serialStatus.textContent =
                "error";
        }

    }
    finally{

        try{

            if(serialReader){

                serialReader.releaseLock();

            }

        }
        catch{}

        serialReader = null;
    }
}


/* =====================================================
   SERIAL DIAGNOSTIC
====================================================== */

function analyzeSerialLine(line){

    const lower =
        line.toLowerCase();


    if(
        lower.includes("error") ||
        lower.includes("failed") ||
        lower.includes("nan") ||
        lower.includes("timeout")
    ){

        addChatMessage(
            "diagnostic",
            "Serial output indicates a possible runtime or sensor problem: " +
            line
        );


        showPopup(
            "Serial diagnostic detected: " +
            line,
            "info"
        );
    }
}


/* =====================================================
   CLOSE SERIAL BEFORE FLASH
====================================================== */

async function releaseSerialForFlashing(){

    /*
       esptool needs exclusive access to COM8.

       Therefore close the serial monitor first.
    */


    isSerialOpen =
        false;


    if(serialReader){

        try{

            await serialReader.cancel();

        }
        catch(error){

            console.warn(
                "Serial reader cancel warning:",
                error
            );
        }

        try{

            serialReader.releaseLock();

        }
        catch{}

        serialReader =
            null;
    }


    if(
        serialPort &&
        serialPort.readable
    ){

        try{

            await serialPort.close();

        }
        catch(error){

            console.warn(
                "Could not close serial port:",
                error
            );
        }
    }


    serialStatus.textContent =
        "flashing";


    connectionBadge.textContent =
        "🟡 flashing";
}


/* =====================================================
   FLASH ESP32
====================================================== */

async function flashToBoard(){

    if(flashing)
        return;


    const checkbox =
        document.getElementById(
            "wiringDoneCheck"
        );


    if(
        !checkbox ||
        !checkbox.checked
    ){

        showPopup(
            "Please confirm the hardware connections first.",
            "info"
        );

        return;
    }


    if(
        !currentProjectContext.firmware
    ){

        showPopup(
            "Compiled firmware is not available.",
            "error"
        );

        return;
    }


    if(
        !navigator.serial
    ){

        showPopup(
            "Web Serial is not supported.",
            "error"
        );

        return;
    }


    flashing =
        true;


    updateFlashButton();


    const status =
        document.getElementById(
            "firmwareStatus"
        );


    try{

        /* -----------------------------------------
           RELEASE SERIAL MONITOR
        ----------------------------------------- */

        addChatMessage(
            "system",
            "Closing serial monitor before flashing..."
        );


        await releaseSerialForFlashing();


        /*
           IMPORTANT:
           The port is now closed and available
           for esptool-js.
        */


        /* -----------------------------------------
           LOAD ESPTOOL-JS
        ----------------------------------------- */

        addChatMessage(
            "system",
            "Loading ESP32 flashing engine..."
        );


        const {
            ESPLoader,
            Transport
        } =
            await import(
                "https://unpkg.com/esptool-js@0.6.1/bundle.js"
            );


        addChatMessage(
            "system",
            "Flashing engine loaded."
        );


        /* -----------------------------------------
           REQUEST PORT IF NEEDED
        ----------------------------------------- */

        if(!serialPort){

            serialPort =
                await navigator.serial.requestPort();
        }


        /* -----------------------------------------
           TRANSPORT
        ----------------------------------------- */

        const transport =
            new Transport(
                serialPort,
                true
            );


        /* -----------------------------------------
           ESP LOADER
        ----------------------------------------- */

        const esploader =
            new ESPLoader({

                transport:transport,

                /*
                   115200 is intentionally used
                   for stable browser flashing.
                */

                baudrate:115200,

                terminal:{

                    clean(){},

                    writeLine(data){

                        console.log(
                            data
                        );
                    },

                    write(data){

                        console.log(
                            data
                        );
                    }
                }
            });


        /* -----------------------------------------
           CONNECT TO BOOTLOADER
        ----------------------------------------- */

        if(status){

            status.textContent =
                "Connecting to ESP32 bootloader...";
        }


        showPopup(
            "Connecting to ESP32 bootloader...",
            "info"
        );


        await esploader.main();


        console.log(
            "Detected ESP32:",
            esploader.chip
        );


        /* -----------------------------------------
           FIRMWARE DATA
        ----------------------------------------- */

        const firmware =
            currentProjectContext
                .firmware;


        const firmwareData =
            base64ToUint8Array(
                firmware.data
            );


        let bootloaderData =
            null;


        let partitionsData =
            null;


        if(
            firmware.bootloader &&
            firmware.bootloader.data
        ){

            bootloaderData =
                base64ToUint8Array(
                    firmware.bootloader.data
                );
        }


        if(
            firmware.partitions &&
            firmware.partitions.data
        ){

            partitionsData =
                base64ToUint8Array(
                    firmware.partitions.data
                );
        }


        /* -----------------------------------------
           FILE ARRAY
        ----------------------------------------- */

        const fileArray = [];


        if(bootloaderData){

            fileArray.push({

                data:bootloaderData,

                address:
                    0x1000
            });
        }


        if(partitionsData){

            fileArray.push({

                data:partitionsData,

                address:
                    0x8000
            });
        }


        fileArray.push({

            data:firmwareData,

            address:
                0x10000
        });


        console.log(
            "Files being flashed:",
            fileArray
        );


        /* -----------------------------------------
           START FLASH
        ----------------------------------------- */

        if(status){

            status.textContent =
                "Uploading firmware...";
        }


        showPopup(
            "Uploading firmware to ESP32...",
            "success"
        );


        addChatMessage(
            "system",
            "Uploading firmware to ESP32..."
        );


        await esploader.writeFlash({

            fileArray:fileArray,

            flashMode:"dio",

            flashFreq:"80m",

            flashSize:"4MB",

            eraseAll:false,

            compress:false,


            reportProgress:
                function(
                    fileIndex,
                    written,
                    total
                ){

                    const percent =
                        Math.round(
                            (written / total) *
                            100
                        );


                    if(status){

                        status.textContent =
                            "Uploading firmware... " +
                            percent +
                            "%";
                    }


                    console.log(
                        "File",
                        fileIndex,
                        percent + "%"
                    );
                }
        });


        /* -----------------------------------------
           HARD RESET
        ----------------------------------------- */

        if(status){

            status.textContent =
                "Upload complete. Restarting ESP32...";
        }


        addChatMessage(
            "system",
            "Firmware upload complete. Restarting ESP32..."
        );


        try{

            await esploader.hardReset();

        }
        catch(error){

            console.warn(
                "Hard reset warning:",
                error
            );
        }


        /*
         * VERY IMPORTANT
         *
         * Release esptool's transport before
         * opening the serial monitor.
         */

        try{

            await transport.disconnect();

            console.log(
                "esptool transport disconnected."
            );

        }
        catch(error){

            console.warn(
                "Transport disconnect warning:",
                error
            );
        }


        showPopup(
            "ESP32 firmware uploaded successfully! 🚀",
            "success"
        );


        addChatMessage(
            "system",
            "ESP32 is now running the generated firmware."
        );


        if(status){

            status.textContent =
                "Firmware uploaded successfully. Restarted.";
        }


        serialStatus.textContent =
            "firmware running";


        connectionBadge.textContent =
            "🟢 firmware running";


        /*
         * Give ESP32 time to reboot.
         */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    1500
                )
        );


        /*
         * Re-open serial monitor.
         */

        await openSerialMonitor();


    }
    catch(error){

        console.error(
            "FLASH ERROR:",
            error
        );


        showPopup(
            "Firmware upload failed: " +
            (
                error.message ||
                error
            ),
            "error"
        );


        addChatMessage(
            "system",
            "Firmware upload failed: " +
            (
                error.message ||
                error
            )
        );


        if(status){

            status.textContent =
                "Upload failed: " +
                (
                    error.message ||
                    error
                );
        }

    }
    finally{

        flashing =
            false;


        updateFlashButton();
    }
}


/* =====================================================
   BASE64 → UINT8ARRAY
====================================================== */

function base64ToUint8Array(base64){

    const binaryString =
        atob(base64);


    const len =
        binaryString.length;


    const bytes =
        new Uint8Array(len);


    for(
        let i = 0;
        i < len;
        i++
    ){

        bytes[i] =
            binaryString.charCodeAt(i);
    }


    return bytes;
}


/* =====================================================
   FLASH BUTTON STATE
====================================================== */

function updateFlashButton(){

    const checkbox =
        document.getElementById(
            "wiringDoneCheck"
        );


    const flashButton =
        document.getElementById(
            "flashBtn"
        );


    const status =
        document.getElementById(
            "firmwareStatus"
        );


    if(!flashButton)
        return;


    const ready =
        checkbox &&
        checkbox.checked &&
        currentProjectContext.firmware &&
        !flashing;


    flashButton.disabled =
        !ready;


    if(ready){

        flashButton.textContent =
            "⬆️ Upload firmware";


        if(status){

            status.textContent =
                "Hardware connection confirmed. Firmware upload is ready.";
        }

    }
    else if(
        flashing
    ){

        flashButton.textContent =
            "⏳ Uploading...";

    }
    else if(
        !currentProjectContext.firmware
    ){

        if(status){

            status.textContent =
                "Waiting for firmware compilation...";
        }

    }
    else if(
        checkbox &&
        !checkbox.checked
    ){

        if(status){

            status.textContent =
                "Confirm the hardware connections before uploading.";
        }
    }
}


/* =====================================================
   DISCONNECT
====================================================== */

async function disconnectBoard(){

    try{

        isSerialOpen =
            false;


        if(serialReader){

            try{

                await serialReader.cancel();

            }
            catch{}

            try{

                serialReader.releaseLock();

            }
            catch{}

            serialReader =
                null;
        }


        if(serialPort){

            try{

                await serialPort.close();

            }
            catch{}
        }

    }
    catch(error){

        console.error(error);
    }


    serialPort =
        null;


    isSerialOpen =
        false;


    serialStatus.textContent =
        "disconnected";


    connectionBadge.classList.add(
        "hidden"
    );


    connectBtn.textContent =
        "Connect ESP32";


    connectBtn.disabled =
        false;


    connectBtn.classList.remove(
        "bg-emerald-700"
    );


    connectBtn.classList.add(
        "bg-blue-600"
    );
}


/* =====================================================
   SERIAL DISCONNECT EVENT
====================================================== */

if(navigator.serial){

    navigator.serial.addEventListener(
        "disconnect",
        event=>{

            if(
                serialPort ===
                event.target
            ){

                disconnectBoard();
            }
        }
    );
}
