
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>No-Code AI Hardware Mentor</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:#e2e8f0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,textarea,input{font:inherit}
.card{background:linear-gradient(180deg,rgba(30,41,59,.72),rgba(15,23,42,.78));border:1px solid #334155}
.card:hover{border-color:#0e7490}
.code{font:13px/1.6 "Cascadia Code","Fira Code",Consolas,monospace;tab-size:2}
.serial{font:12px/1.55 "Cascadia Code","Fira Code",monospace}
.scroll::-webkit-scrollbar{width:7px;height:7px}
.scroll::-webkit-scrollbar-thumb{background:#334155;border-radius:10px}
.modal-bg{background:rgba(2,6,23,.82);backdrop-filter:blur(8px)}
.fade{animation:fade .16s ease-out}
.spin{animation:spin 1s linear infinite}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="h-screen flex overflow-hidden">
<aside class="w-[370px] xl:w-[420px] shrink-0 bg-[#0f172a] border-r border-slate-800 flex flex-col">
<header class="h-16 shrink-0 px-5 flex items-center gap-3 border-b border-slate-800">
<div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 grid place-items-center text-slate-950 font-black">AI</div>
<div><div class="font-bold text-white">No-Code AI Hardware Mentor</div><div class="text-[11px] text-slate-500">Pair programmer · Instructor · AI Doctor</div></div>
</header>

<section class="p-4 border-b border-slate-800">
<div class="flex justify-between items-center mb-2">
<label class="text-[10px] uppercase tracking-[.18em] text-slate-500">Project idea</label>
<span id="backendState" class="text-[10px] text-slate-500">checking backend…</span>
</div>
<textarea id="projectPrompt" rows="4" class="w-full resize-none rounded-xl bg-[#090f1b] border border-slate-700 p-3 text-sm outline-none focus:border-cyan-500" placeholder="Describe what you want to build…"></textarea>
<button id="generateBtn" class="w-full mt-3 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold">✦ Start hardware design</button>
</section>

<section class="flex-1 min-h-0 flex flex-col">
<div class="px-4 pt-4 pb-2 flex justify-between items-center">
<span class="text-xs text-slate-300">AI Chat Log</span>
<button id="clearChat" class="text-[10px] text-slate-500 hover:text-white">clear</button>
</div>
<div id="chatLog" class="scroll flex-1 overflow-y-auto px-4 pb-3 space-y-2"></div>
</section>

<section class="px-3 pb-3 border-t border-slate-800 bg-[#0a0f1a]">
<div class="flex justify-between items-center py-2">
<span class="text-xs font-semibold text-slate-300">Troubleshoot</span>
<span id="healthText" class="text-[10px] text-slate-500">waiting</span>
</div>
<div class="flex gap-2">
<input id="troubleshootInput" class="flex-1 min-w-0 rounded-lg bg-[#070d17] border border-slate-700 px-3 py-2 text-xs outline-none focus:border-cyan-500" placeholder="Ask about code, pins, hardware or errors…">
<button id="troubleshootBtn" class="px-3 py-2 rounded-lg bg-violet-600 hover:bg-violet-500 text-xs font-semibold">Troubleshoot</button>
</div>
</section>

<section class="h-48 shrink-0 border-t border-slate-800 bg-[#080d17] p-3 flex flex-col">
<div class="flex justify-between mb-2 text-xs">
<span>Live Serial Monitor</span>
<span id="serialStatus" class="text-slate-500">disconnected</span>
</div>
<div id="serialOutput" class="serial scroll flex-1 overflow-y-auto rounded-lg bg-black/40 border border-slate-800 p-2"></div>
</section>
</aside>

<main class="flex-1 min-w-0 flex flex-col">
<header class="h-16 shrink-0 border-b border-slate-800 px-6 flex items-center gap-3">
<div class="min-w-0">
<div id="projectTitle" class="font-semibold text-white truncate">Workspace</div>
<div id="phaseLabel" class="text-[11px] text-slate-500">Describe a project to begin</div>
</div>
<div class="ml-auto flex gap-2 items-center">
<span id="connectionBadge" class="hidden px-3 py-1.5 rounded-full border border-slate-700 bg-slate-900 text-[11px]"></span>
<button id="connectBtn" class="hidden px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-semibold">Connect ESP32</button>
<button id="resetBtn" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs">Reset</button>
</div>
</header>
<div id="workspace" class="scroll flex-1 overflow-y-auto p-6"></div>
</main>
</div>

<div id="modalRoot" class="hidden fixed inset-0 z-50"></div>
<div id="popupRoot" class="fixed right-5 bottom-5 z-[80] w-[390px] max-w-[calc(100vw-40px)] space-y-2"></div>

<script>
const API="http://127.0.0.1:5000";
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const state={
  phase:0,
  prompt:"",
  plan:null,
  selected:[],
  project:null,
  finalCode:"",
  firmware:null,
  serialPort:null,
  serialReader:null,
  serialPipe:null,
  serialOpen:false,
  flashing:false,
  serialLines:[],
  diagBusy:false,
  runtimeEvents:new Set(),
  health:{},
  commissioning:false,
  commissionResults:[],
  mainFirmware:null
};

function esc(value){
  const d=document.createElement("div");
  d.textContent=String(value??"");
  return d.innerHTML;
}

function popup(message,type="info"){
  const map={
    error:["border-red-500","bg-red-950/90","⚠️","Attention"],
    success:["border-emerald-500","bg-emerald-950/90","✓","Done"],
    info:["border-cyan-500","bg-slate-900/95","ℹ","Mentor"]
  };
  const [bc,bg,icon,title]=map[type]||map.info;
  const el=document.createElement("div");
  el.className=`fade border-l-4 ${bc} ${bg} rounded-xl p-3 shadow-2xl flex gap-3 text-sm`;
  el.innerHTML=`<div>${icon}</div><div class="flex-1"><div class="font-semibold">${title}</div><div class="text-slate-300 mt-1">${esc(message)}</div></div><button class="text-slate-500 hover:text-white">×</button>`;
  el.querySelector("button").onclick=()=>el.remove();
  $("popupRoot").appendChild(el);
  setTimeout(()=>el.remove(),6500);
}

function chat(role,text){
  const colors={
    user:"border-cyan-500 bg-slate-800",
    ai:"border-emerald-500 bg-slate-800/80",
    system:"border-slate-600 bg-slate-900/60",
    doctor:"border-amber-500 bg-amber-950/30"
  };
  const titles={user:"YOU",ai:"AI MENTOR",system:"SYSTEM",doctor:"AI DOCTOR"};
  const el=document.createElement("div");
  el.className=`fade border-l-2 ${colors[role]||colors.system} rounded-r-xl p-3 text-xs`;
  el.innerHTML=`<div class="font-semibold ${role==="user"?"text-cyan-400":role==="ai"?"text-emerald-400":role==="doctor"?"text-amber-400":"text-slate-500"}">${titles[role]||"SYSTEM"}</div><div class="mt-1 text-slate-300 whitespace-pre-wrap">${esc(text)}</div>`;
  $("chatLog").appendChild(el);
  $("chatLog").scrollTop=$("chatLog").scrollHeight;
}

function phase(number,label){
  state.phase=number;
  $("phaseLabel").textContent=label;
}

function setConnection(text,cls){
  $("connectionBadge").className=`px-3 py-1.5 rounded-full border border-slate-700 bg-slate-900 text-[11px] ${cls}`;
  $("connectionBadge").textContent=text;
  $("connectionBadge").classList.remove("hidden");
}

async function api(path,body,timeout=180000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const response=await fetch(API+path,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body),
      signal:controller.signal
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok||data.success===false)throw new Error(data.error||data.details||`Request failed (${response.status})`);
    return data;
  }catch(error){
    if(error.name==="AbortError")throw new Error("Request timed out");
    throw new Error(error.message||"Backend unavailable");
  }finally{
    clearTimeout(timer);
  }
}

async function health(){
  try{
    const response=await fetch(API+"/health");
    const data=await response.json();
    $("backendState").textContent=data.arduino_cli?"backend ready":"Arduino CLI missing";
    $("backendState").className=`text-[10px] ${data.arduino_cli?"text-emerald-400":"text-amber-400"}`;
  }catch{
    $("backendState").textContent="backend offline";
    $("backendState").className="text-[10px] text-red-400";
  }
}
setInterval(health,30000);

function fallbackPlan(){
  return{
    project_title:"ESP32 LED Demonstration",
    project_summary:"ESP32 LED blinking on GPIO 2 with automatic serial diagnostics.",
    categories:[
      {
        id:"microcontroller",
        name:"Microcontroller",
        purpose:"Main controller",
        options:[
          {id:"esp32",name:"ESP32 DevKit",recommended:true,price_inr:"₹400-₹700",description:"ESP32 development board.",reason:"Native ESP32 workflow."},
          {id:"esp32-alt",name:"ESP32 WROOM board",recommended:false,price_inr:"₹450-₹800",description:"Common ESP32 development board.",reason:"Alternative ESP32 board."}
        ]
      },
      {
        id:"output",
        name:"Output",
        purpose:"Visible output",
        options:[
          {id:"led",name:"LED + 220Ω resistor",recommended:true,price_inr:"₹7-₹15",description:"Simple GPIO output.",reason:"Easy first test."},
          {id:"rgb",name:"RGB LED",recommended:false,price_inr:"₹10-₹25",description:"Multi-colour output.",reason:"Alternative output."}
        ]
      }
    ]
  };
}

function fallbackProject(){
  return{
    chat_message:"Local ESP32 LED demonstration loaded.",
    components:[
      {id:"esp32",name:"ESP32 DevKit",type:"controller",purpose:"Microcontroller"},
      {id:"led",name:"LED",type:"output",purpose:"Visual output"},
      {id:"r220",name:"220Ω resistor",type:"other",purpose:"Current limiting"}
    ],
    wiring:[
      {id:"w1",component_id:"led",step:1,text:"Connect ESP32 GPIO 2 (D2) to the LED anode through a 220Ω resistor.",verify:"GPIO 2 is the LED signal path."},
      {id:"w2",component_id:"led",step:2,text:"Connect the LED cathode to ESP32 GND.",verify:"LED ground path is connected."},
      {id:"w3",component_id:"esp32",step:3,text:"Connect the ESP32 to the computer using USB.",verify:"Board powers and enumerates over USB."}
    ],
    pin_map:[
      {component_id:"led",gpio:2,signal:"LED",power:"3.3V",ground:"GND",interface:"digital"}
    ],
    cpp_code:`#define LED_PIN 2

void setup() {
  Serial.begin(115200);
  pinMode(LED_PIN, OUTPUT);
  Serial.println("[AI_DIAG] BOOT_OK");
  Serial.println("[AI_DIAG] SYSTEM_READY");
}

void loop() {
  digitalWrite(LED_PIN, HIGH);
  Serial.println("[AI_OUTPUT] led=ON");
  delay(1000);

  digitalWrite(LED_PIN, LOW);
  Serial.println("[AI_OUTPUT] led=OFF");
  delay(1000);
}`
  };
}

async function startDesign(){
  const prompt=$("projectPrompt").value.trim();
  if(!prompt){popup("Describe your project first.","error");return}

  await closeSerial();

  state.prompt=prompt;
  state.selected=[];
  state.project=null;
  state.firmware=null;
  state.finalCode="";
  state.health={};
  state.runtimeEvents.clear();
  $("chatLog").innerHTML="";
  $("serialOutput").innerHTML="";
  $("projectTitle").textContent=prompt;
  chat("user",prompt);
  phase(1,"Phase 1 · Hardware wizard");

  const button=$("generateBtn");
  button.disabled=true;
  button.innerHTML='<span class="spin inline-block">◌</span> Planning hardware…';

  try{
    try{
      state.plan=await api("/plan_hardware",{prompt});
    }catch(error){
      if(/quota|unavailable|missing/i.test(error.message)){
        state.plan=fallbackPlan();
        chat("system","Gemini planning is unavailable. The local demonstration plan is loaded.");
      }else{
        throw error;
      }
    }
    openWizard();
  }catch(error){
    chat("system",error.message);
    popup(error.message,"error");
  }finally{
    button.disabled=false;
    button.innerHTML="✦ Start hardware design";
  }
}

function openWizard(){
  const categories=state.plan?.categories||[];
  if(!categories.length){popup("No hardware categories were returned.","error");return}

  const root=$("modalRoot");
  root.className="fixed inset-0 z-50 modal-bg flex items-center justify-center p-4";
  let index=0;

  function draw(){
    const category=categories[index];
    const selected=state.selected.find(x=>x.category_id===category.id)?.id;

    root.innerHTML=`<div class="w-full max-w-4xl max-h-[92vh] overflow-hidden rounded-2xl card">
      <div class="p-5 border-b border-slate-700 flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-cyan-500/15 text-cyan-300 grid place-items-center">${index+1}</div>
        <div class="flex-1"><div class="text-lg font-bold">Hardware Wizard</div><div class="text-xs text-slate-500">${esc(category.name)} · ${esc(category.purpose||"Choose a component")}</div></div>
        <button id="wizClose" class="text-slate-500 hover:text-white">×</button>
      </div>
      <div class="p-5 scroll overflow-y-auto max-h-[64vh]">
        <div class="flex gap-2 mb-5">${categories.map((x,i)=>`<div class="flex-1 h-1.5 rounded ${i<index?"bg-emerald-500":i===index?"bg-cyan-400":"bg-slate-700"}"></div>`).join("")}</div>
        <div class="grid md:grid-cols-2 gap-3">
          ${(category.options||[]).map(option=>`
            <button data-option="${esc(option.id)}" class="text-left p-4 rounded-xl border ${selected===option.id?"border-cyan-400 bg-cyan-950/30":"border-slate-700 bg-slate-900/50 hover:border-slate-500"}">
              <div class="flex gap-2">
                <div class="flex-1">
                  <div class="flex items-center gap-2">
                    <span class="font-semibold">${esc(option.name)}</span>
                    ${option.recommended?'<span class="text-[9px] px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300">RECOMMENDED</span>':""}
                  </div>
                  <div class="text-xs text-emerald-400 mt-1">${esc(option.price_inr||"Approximate price")}</div>
                  <div class="text-xs text-slate-400 mt-2">${esc(option.description||"")}</div>
                  <div class="text-[11px] text-slate-500 mt-2">${esc(option.reason||"")}</div>
                </div>
                ${selected===option.id?'<div class="text-cyan-300">✓</div>':""}
              </div>
            </button>`).join("")}
        </div>
      </div>
      <div class="p-4 border-t border-slate-700 flex justify-between">
        <button id="wizBack" class="px-4 py-2 rounded-lg bg-slate-800 text-xs ${index?"":"invisible"}">Back</button>
        <button id="wizNext" class="px-5 py-2 rounded-lg bg-cyan-500 text-slate-950 font-bold text-xs">${index===categories.length-1?"Finish selection":"Next category"}</button>
      </div>
    </div>`;

    $("wizClose").onclick=closeModal;

    root.querySelectorAll("[data-option]").forEach(button=>{
      button.onclick=()=>{
        const option=category.options.find(x=>x.id===button.dataset.option);
        state.selected=state.selected.filter(x=>x.category_id!==category.id);
        state.selected.push({
          ...option,
          category_id:category.id,
          category_name:category.name
        });
        draw();
      };
    });

    $("wizBack").onclick=()=>{if(index>0){index--;draw()}};

    $("wizNext").onclick=()=>{
      if(!state.selected.some(x=>x.category_id===category.id)){
        popup("Choose an option before continuing.");
        return;
      }
      if(index<categories.length-1){
        index++;
        draw();
      }else{
        closeModal();
        renderSummary();
      }
    };
  }

  draw();
}

function closeModal(){
  $("modalRoot").className="hidden fixed inset-0 z-50";
}

function renderSummary(){
  phase(2,"Phase 2 · Hardware summary");
  $("connectBtn").classList.add("hidden");

  $("workspace").innerHTML=`<div class="max-w-6xl mx-auto">
    <div class="mb-7">
      <div class="text-xs text-cyan-400 uppercase tracking-widest">Hardware manifest</div>
      <h1 class="text-3xl font-bold mt-2">Your build, your parts.</h1>
      <p class="text-sm text-slate-400 mt-2">Review the exact hardware before generating the workspace.</p>
    </div>

    <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">
      ${state.selected.map(part=>`
        <div class="card rounded-2xl p-5">
          <div class="text-[10px] uppercase tracking-widest text-slate-500">${esc(part.category_name)}</div>
          <div class="font-bold mt-2">${esc(part.name)}</div>
          <div class="text-emerald-400 text-xs mt-1">${esc(part.price_inr||"Approximate price")}</div>
          <p class="text-xs text-slate-400 mt-3">${esc(part.description||part.reason||"")}</p>
        </div>`).join("")}
    </div>

    <div class="card rounded-2xl p-5 mt-5 flex flex-col xl:flex-row gap-4 xl:items-center">
      <div class="flex-1">
        <div class="font-semibold">Ready to build?</div>
        <div class="text-xs text-slate-500 mt-1">Workspace generation is locked until the physical parts are confirmed.</div>
      </div>
      <label class="flex items-center gap-2 text-xs">
        <input id="partsReady" type="checkbox" class="w-4 h-4 accent-cyan-500">
        I have these parts ready
      </label>
      <button id="editParts" class="px-4 py-2 rounded-lg bg-slate-800 text-xs">Edit</button>
      <button id="genWorkspace" disabled class="px-5 py-2 rounded-lg bg-cyan-500 text-slate-950 font-bold text-xs disabled:opacity-30">Generate Workspace</button>
    </div>
  </div>`;

  $("partsReady").onchange=e=>$("genWorkspace").disabled=!e.target.checked;
  $("editParts").onclick=openWizard;
  $("genWorkspace").onclick=buildWorkspace;
}

async function buildWorkspace(){
  phase(3,"Phase 3 · Collaborative workspace");
  chat("system","Generating wiring, firmware and autonomous diagnostic telemetry…");

  const fallback=/led/i.test(state.prompt)&&/(d2|gpio 2|pin 2|serial)/i.test(state.prompt);

  try{
    try{
      state.project=await api("/build_project",{
        prompt:state.prompt,
        selected_components:state.selected
      });
    }catch(error){
      if(fallback){
        state.project=fallbackProject();
        chat("system","AI build generation is unavailable. Local ESP32 demonstration loaded.");
      }else{
        throw error;
      }
    }

    state.finalCode=state.project.cpp_code;
    state.health={};

    renderWorkspace();
    chat("ai",state.project.chat_message||"Workspace generated.");
  }catch(error){
    popup(error.message,"error");
  }
}

function renderWorkspace(){
  $("connectBtn").classList.remove("hidden");
  const project=state.project;

  $("workspace").innerHTML=`<div class="flex flex-col gap-4 min-h-[720px]">
    <div class="flex items-start gap-4">
      <div class="flex-1">
        <div class="text-xs text-cyan-400 uppercase tracking-widest">Collaborative workspace</div>
        <h1 class="text-3xl font-bold mt-1">Wire it. Edit it. Flash it.</h1>
        <p class="text-xs text-slate-500 mt-1">Sensor health is analyzed automatically from telemetry. Troubleshooting remains available on the left.</p>
      </div>
      <button id="systemTestBtn" class="px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500 text-xs font-bold">Run System Troubleshoot</button>
    </div>

    <div id="healthPanel" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-2"></div>

    <div class="grid xl:grid-cols-2 gap-4 flex-1 min-h-0">
      <section class="card rounded-2xl p-4 flex flex-col min-h-[610px]">
        <div class="flex justify-between mb-3">
          <div><div class="font-semibold">Wiring checklist</div><div class="text-xs text-slate-500">Confirm every connection before upload.</div></div>
          <span id="wireProgress" class="text-xs text-cyan-400">0/${project.wiring?.length||0}</span>
        </div>
        <div id="wiringList" class="scroll overflow-y-auto flex-1 space-y-2">
          ${(project.wiring||[]).map((wire,i)=>`
            <label class="block rounded-xl p-3 border border-slate-800 bg-slate-900/60">
              <div class="flex gap-3">
                <input type="checkbox" class="wireCheck mt-1 accent-cyan-500" data-i="${i}">
                <div>
                  <div class="text-sm text-slate-200"><span class="text-cyan-400 text-xs">${i+1}</span> ${esc(wire.text)}</div>
                  <div class="text-[10px] text-slate-500 mt-1">Verify: ${esc(wire.verify||"Check this connection.")}</div>
                </div>
              </div>
            </label>`).join("")}
        </div>
        <label class="mt-3 p-3 rounded-xl border border-slate-800 bg-slate-900/50 text-xs">
          <input id="hardwareReady" type="checkbox" class="accent-emerald-500 mr-2">
          I've finished the hardware connections
        </label>
      </section>

      <section class="card rounded-2xl overflow-hidden flex flex-col min-h-[610px]">
        <div class="px-4 py-3 border-b border-slate-700 bg-slate-900/70 flex justify-between items-center">
          <div><div class="font-semibold">AI Pair Programmer</div><div class="text-xs text-slate-500">Editable Arduino C++</div></div>
          <div class="flex gap-2">
            <button id="copyCode" class="px-3 py-1.5 rounded bg-slate-800 text-xs">Copy</button>
            <button id="resetCode" class="px-3 py-1.5 rounded bg-slate-800 text-xs">Reset AI code</button>
          </div>
        </div>
        <textarea id="codeEditor" class="code scroll flex-1 min-h-[500px] resize-none bg-[#050a12] text-cyan-100 p-4 outline-none" spellcheck="false">${esc(project.cpp_code||"")}</textarea>
        <div class="p-3 border-t border-slate-700 flex gap-2 flex-wrap items-center">
          <button id="compileBtn" class="px-4 py-2 rounded-lg bg-slate-700 text-xs font-semibold">Compile only</button>
          <button id="uploadBtn" disabled class="px-5 py-2 rounded-lg bg-emerald-600 text-xs font-bold disabled:opacity-30">⬆ Upload to ESP32</button>
          <span id="compileStatus" class="text-[10px] text-slate-500">Not compiled</span>
        </div>
      </section>
    </div>
  </div>`;

  document.querySelectorAll(".wireCheck").forEach(x=>x.onchange=updateReady);

  $("hardwareReady").onchange=updateReady;

  $("codeEditor").addEventListener("input",()=>{
    state.firmware=null;
    $("compileStatus").textContent="Code changed · recompile required";
    updateReady();
  });

  $("compileBtn").onclick=()=>compileCurrent(false);
  $("uploadBtn").onclick=()=>compileCurrent(true);
  $("copyCode").onclick=copyCode;

  $("resetCode").onclick=()=>{
    $("codeEditor").value=state.finalCode;
    state.firmware=null;
    $("compileStatus").textContent="AI code restored · recompile required";
    updateReady();
  };

  $("systemTestBtn").onclick=runSystemTroubleshoot;
  updateHealthPanel();
  updateReady();
}

function updateReady(){
  const checks=[...document.querySelectorAll(".wireCheck")];
  const wireOk=checks.length===0||checks.every(x=>x.checked);
  const hardwareOk=$("hardwareReady")?.checked;

  $("wireProgress").textContent=
    `${checks.filter(x=>x.checked).length}/${checks.length}`;

  $("uploadBtn").disabled=
    !(wireOk&&hardwareOk&&!state.flashing);
}

async function copyCode(){
  try{
    await navigator.clipboard.writeText($("codeEditor").value);
    popup("Code copied.","success");
  }catch{
    popup("Could not copy the code.","error");
  }
}

async function compileCurrent(upload){
  const code=$("codeEditor")?.value.trim();
  if(!code){popup("The editor is empty.","error");return}

  $("compileBtn").disabled=true;
  $("compileStatus").textContent="Compiling…";
  state.firmware=null;
  updateReady();

  chat("system","Compiling the current editor contents with Arduino CLI…");

  try{
    const result=await api("/compile",{cpp_code:code},200000);
    state.firmware=result;
    state.finalCode=code;
    $("compileStatus").textContent=`Compiled · ${(result.firmware.size/1024).toFixed(1)} KB`;
    chat("system","Compilation succeeded. ESP32 firmware is ready.");
    popup("Compilation successful.","success");
    updateReady();

    if(upload)await flashFirmware(result,true);
  }catch(error){
    $("compileStatus").textContent="Compile failed";
    chat("doctor","Compiler error: "+error.message);

    const diagnosis=await compilerDoctor(code,error.message);

    if(diagnosis?.suggested_code){
      showPermission(
        "Compiler fix requested",
        diagnosis.user_message||diagnosis.summary||"AI Doctor found a software issue.",
        diagnosis.suggested_code,
        async()=>{
          $("codeEditor").value=diagnosis.suggested_code;
          state.firmware=null;
          $("compileStatus").textContent="AI fix applied · recompiling";
          await compileCurrent(true);
        },
        diagnosis.evidence||[]
      );
    }
  }finally{
    $("compileBtn").disabled=false;
    updateReady();
  }
}

async function compilerDoctor(code,error){
  try{
    const d=await api("/diagnose",{
      mode:"compiler",
      project:state.prompt,
      cpp_code:code,
      compiler_error:error,
      serial_logs:state.serialLines.slice(-40).join("\n"),
      selected_components:state.selected,
      wiring:state.project?.wiring||[],
      pin_map:state.project?.pin_map||[]
    },60000);

    chat("doctor",d.user_message||d.summary||"The compiler reported a software issue.");
    return d;
  }catch(e){
    chat("doctor","AI compiler diagnosis unavailable: "+e.message);
    return null;
  }
}

function showPermission(title,message,code,approve,evidence=[]){
  const root=$("modalRoot");
  root.className="fixed inset-0 z-50 modal-bg flex items-center justify-center p-4";
  root.innerHTML=`<div class="w-full max-w-2xl rounded-2xl card p-6">
    <div class="text-xs uppercase tracking-widest text-amber-400">Permission required</div>
    <h2 class="text-xl font-bold mt-2">${esc(title)}</h2>
    <p class="text-sm text-slate-300 mt-3">${esc(message)}</p>
    ${evidence.length?`<div class="mt-3 text-xs text-slate-500">${evidence.map(esc).join("<br>")}</div>`:""}
    <pre class="scroll max-h-60 overflow-auto bg-black/50 border border-slate-800 rounded-xl p-3 mt-4 text-xs text-cyan-200">${esc(code)}</pre>
    <div class="flex justify-end gap-2 mt-5">
      <button id="permKeep" class="px-4 py-2 rounded-lg bg-slate-800 text-xs">Keep my code</button>
      <button id="permApprove" class="px-4 py-2 rounded-lg bg-amber-500 text-slate-950 font-bold text-xs">Approve AI change</button>
    </div>
  </div>`;

  $("permKeep").onclick=closeModal;
  $("permApprove").onclick=async()=>{
    closeModal();
    await approve();
  };
}

async function sendTroubleshoot(){
  const input=$("troubleshootInput");
  const message=input.value.trim();

  if(!message)return;

  if(!state.project){
    chat("system","Generate a project first so troubleshooting has the project, hardware and code context.");
    return;
  }

  input.value="";
  chat("user",message);

  try{
    const d=await api("/troubleshoot",{
      message,
      project:state.prompt,
      cpp_code:$("codeEditor").value,
      serial_logs:state.serialLines.slice(-80).join("\n"),
      selected_components:state.selected,
      wiring:state.project.wiring||[],
      pin_map:state.project.pin_map||[]
    },60000);

    chat(d.issue_type==="HARDWARE"?"doctor":"ai",d.reply||"Troubleshooting analysis completed.");

    if(d.issue_type==="HARDWARE"&&d.physical_steps?.length){
      showTroubleshootResult(d);
    }

    if(d.change_type!=="NONE"){
      const proposed=d.change_type==="PATCH"?d.patched_code:d.full_code;
      if(proposed){
        showPermission(
          d.change_type==="PATCH"?"Targeted code change":"Full code rewrite",
          d.patch_summary||d.diagnostic_reason||d.reply,
          proposed,
          async()=>{
            $("codeEditor").value=proposed;
            state.firmware=null;
            $("compileStatus").textContent="Code changed · recompile required";
            updateReady();
            await compileCurrent(true);
          },
          d.changed_lines||[]
        );
      }
    }
  }catch(error){
    chat("doctor","Troubleshoot request failed: "+error.message);
  }
}

function showTroubleshootResult(d){
  const root=$("modalRoot");
  root.className="fixed inset-0 z-50 modal-bg flex items-center justify-center p-4";
  root.innerHTML=`<div class="w-full max-w-xl rounded-2xl card p-6">
    <div class="text-xs uppercase tracking-widest text-red-400">Hardware troubleshooting</div>
    <h2 class="text-xl font-bold mt-2">${esc(d.reply||"Check the hardware.")}</h2>
    <div class="space-y-2 mt-4">
      ${(d.physical_steps||[]).map((x,i)=>`<div class="p-3 rounded-lg bg-slate-900 border border-slate-800 text-xs"><span class="text-cyan-400">${i+1}.</span> ${esc(x)}</div>`).join("")}
    </div>
    <button id="closeTrouble" class="w-full mt-5 py-2 rounded-lg bg-slate-800 text-xs">Close</button>
  </div>`;
  $("closeTrouble").onclick=closeModal;
}

function componentStatus(id,status,detail){
  state.health[id]={status,detail};
  updateHealthPanel();
}

function updateHealthPanel(){
  const panel=$("healthPanel");
  if(!panel||!state.selected.length)return;

  panel.innerHTML=state.selected.map(component=>{
    const id=component.id;
    const health=state.health[id]||{status:"MONITORING",detail:"Waiting for telemetry"};
    let cls="border-slate-700 bg-slate-900/60";
    if(health.status==="WORKING")cls="border-emerald-500/40 bg-emerald-950/20";
    if(health.status==="FAILED")cls="border-red-500/40 bg-red-950/20";
    if(health.status==="WARNING")cls="border-amber-500/40 bg-amber-950/20";
    return `<div class="rounded-xl border ${cls} px-3 py-2">
      <div class="flex justify-between gap-2"><span class="text-xs font-semibold">${esc(component.name)}</span><span class="text-[9px] uppercase">${esc(health.status)}</span></div>
      <div class="text-[10px] text-slate-500 mt-1 truncate">${esc(health.detail)}</div>
    </div>`;
  }).join("");

  const statuses=Object.values(state.health);
  $("healthText").textContent=statuses.some(x=>x.status==="FAILED")?"issue detected":statuses.some(x=>x.status==="WARNING")?"warning":"monitoring";
}

function findSelected(id){
  return state.selected.find(x=>x.id===id)||null;
}

function parseHealthLine(line){
  let m=line.match(/^\[AI_SENSOR\]\s*([^=\s]+)\s*=\s*(.*)$/i);
  if(m){
    const id=m[1];
    const value=m[2];
    componentStatus(id,"WORKING",value);
  }

  m=line.match(/^\[AI_WARNING\]\s*([^=]+)=(.*)$/i);
  if(m){
    const id=m[1].trim();
    componentStatus(id,"WARNING",m[2].trim());
  }

  m=line.match(/^\[AI_ERROR\]\s*([^=]+)=(.*)$/i);
  if(m){
    const id=m[1].trim();
    componentStatus(id,"FAILED",m[2].trim());
  }
}

function serialAnomaly(line){
  return /\b(NaN|-127|4095|timeout|no ack|not found|failed|fault|error)\b/i.test(line);
}

function handleSerial(line){
  state.serialLines.push(line);
  if(state.serialLines.length>250)state.serialLines.shift();

  const output=$("serialOutput");
  const node=document.createElement("div");
  node.className="serial text-cyan-300";
  node.textContent="> "+line;
  output.appendChild(node);

  while(output.children.length>180)output.firstChild.remove();

  output.scrollTop=output.scrollHeight;
  parseHealthLine(line);

  if(!state.commissioning&&serialAnomaly(line)){
    const fingerprint=line.toLowerCase().replace(/\d+/g,"#").trim();
    if(!state.runtimeEvents.has(fingerprint)){
      state.runtimeEvents.add(fingerprint);
      runtimeDoctor(fingerprint);
    }
  }
}

async function runtimeDoctor(fingerprint){
  if(state.diagBusy||!state.project)return;

  state.diagBusy=true;

  try{
    const d=await api("/diagnose",{
      mode:"runtime",
      project:state.prompt,
      cpp_code:$("codeEditor")?.value||state.project.cpp_code,
      compiler_error:"",
      serial_logs:state.serialLines.slice(-70).join("\n"),
      selected_components:state.selected,
      wiring:state.project.wiring||[],
      pin_map:state.project.pin_map||[]
    },60000);

    chat("doctor",`${d.component?d.component+": ":""}${d.summary||"Runtime issue detected."}\n${d.user_message||""}`);

    const id=d.component_id||"";
    if(id){
      componentStatus(
        id,
        d.fault_type==="HARDWARE"?"FAILED":d.fault_type==="SOFTWARE"?"WARNING":"UNKNOWN",
        d.summary||"Diagnostic result"
      );
    }

    if(d.fault_type==="HARDWARE"&&d.physical_steps?.length){
      showTroubleshootResult({
        reply:d.user_message||d.summary,
        physical_steps:d.physical_steps
      });
    }

    if(d.fault_type==="SOFTWARE"&&d.suggested_code){
      showPermission(
        "Runtime software fix",
        d.user_message||d.summary,
        d.suggested_code,
        async()=>{
          $("codeEditor").value=d.suggested_code;
          state.firmware=null;
          $("compileStatus").textContent="Code changed · recompile required";
          updateReady();
          await compileCurrent(true);
        },
        d.evidence||[]
      );
    }
  }catch(error){
    chat("doctor","Runtime diagnosis unavailable: "+error.message);
  }finally{
    state.diagBusy=false;
  }
}

async function selectPort(){
  if(!navigator.serial){
    popup("Web Serial is not supported. Use Chrome or Edge.","error");
    return false;
  }

  try{
    if(!state.serialPort)state.serialPort=await navigator.serial.requestPort();
    setConnection("● port selected","text-cyan-300");
    return true;
  }catch(error){
    if(error.name!=="NotFoundError")popup(error.message,"error");
    return false;
  }
}

async function openSerial(){
  if(!state.serialPort||state.serialOpen)return;

  try{
    await state.serialPort.open({baudRate:115200});
    state.serialOpen=true;
    $("serialStatus").textContent="connected";
    setConnection("● serial connected","text-emerald-300");
    readSerial();
  }catch(error){
    popup("Serial monitor failed: "+error.message,"error");
  }
}

async function closeSerial(){
  state.serialOpen=false;

  if(state.serialReader){
    try{await state.serialReader.cancel()}catch{}
  }

  if(state.serialReader){
    try{state.serialReader.releaseLock()}catch{}
    state.serialReader=null;
  }

  if(state.serialPipe){
    try{await state.serialPipe}catch{}
    state.serialPipe=null;
  }

  if(state.serialPort){
    try{await state.serialPort.close()}catch{}
  }

  $("serialStatus").textContent="disconnected";
}

async function readSerial(){
  if(!state.serialPort?.readable)return;

  try{
    const decoder=new TextDecoderStream();
    state.serialPipe=state.serialPort.readable.pipeTo(decoder.writable).catch(()=>{});
    state.serialReader=decoder.readable.getReader();

    let buffer="";

    while(state.serialOpen){
      const {value,done}=await state.serialReader.read();
      if(done)break;

      if(value){
        buffer+=value;
        const lines=buffer.split(/\r?\n/);
        buffer=lines.pop()||"";

        for(const raw of lines){
          const line=raw.trim();
          if(line)handleSerial(line);
        }
      }
    }
  }catch(error){
    if(state.serialOpen)console.warn(error);
  }finally{
    try{state.serialReader?.releaseLock()}catch{}
    state.serialReader=null;
  }
}

async function flashFirmware(firmware,reopen=true){
  if(state.flashing)return;

  state.flashing=true;

  try{
    if(!await selectPort())throw new Error("No ESP32 serial port selected.");

    await closeSerial();

    const {ESPLoader,Transport}=await import("https://unpkg.com/esptool-js@0.6.1/bundle.js");

    const transport=new Transport(state.serialPort,true);

    const loader=new ESPLoader({
      transport,
      baudrate:115200,
      terminal:{
        clean(){},
        writeLine:message=>console.log(message),
        write:message=>console.log(message)
      }
    });

    setConnection(reopen?"● flashing":"● commissioning","text-amber-300");

    await loader.main();

    const files=[];

    if(firmware.bootloader?.data){
      files.push({
        data:base64ToBytes(firmware.bootloader.data),
        address:0x1000
      });
    }

    if(firmware.partitions?.data){
      files.push({
        data:base64ToBytes(firmware.partitions.data),
        address:0x8000
      });
    }

    files.push({
      data:base64ToBytes(firmware.firmware.data),
      address:0x10000
    });

    const status=$("compileStatus");

    await loader.writeFlash({
      fileArray:files,
      flashMode:"dio",
      flashFreq:"80m",
      flashSize:"4MB",
      eraseAll:false,
      compress:false,
      reportProgress:(index,written,total)=>{
        if(status)status.textContent=`Uploading ${Math.round(written/total*100)}%`;
      }
    });

    try{await loader.hardReset()}catch{}
    try{await transport.disconnect()}catch{}

    await sleep(1200);

    if(reopen)await openSerial();

    setConnection(
      reopen?"● firmware running":"● test firmware running",
      reopen?"text-emerald-300":"text-violet-300"
    );

    if(reopen)popup("Firmware uploaded successfully.","success");
  }catch(error){
    popup("Upload failed: "+error.message,"error");
    chat("system","Upload failed: "+error.message);
    throw error;
  }finally{
    state.flashing=false;
    updateReady();
  }
}

function base64ToBytes(base64){
  const raw=atob(base64);
  const bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  return bytes;
}

function marker(logs,type,id){
  const safe=id.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return new RegExp(`\\[${type}\\]\\s*component=${safe}(?:\\s|$)`,"i").test(logs);
}

async function runSystemTroubleshoot(){
  if(!state.project||!state.selected.length){
    popup("Generate a project first.","error");
    return;
  }

  if(state.commissioning)return;

  state.commissioning=true;
  state.commissionResults=[];
  state.mainFirmware=null;

  const root=$("modalRoot");
  root.className="fixed inset-0 z-50 modal-bg flex items-center justify-center p-4";

  root.innerHTML=`<div class="w-full max-w-4xl max-h-[90vh] overflow-hidden rounded-2xl card">
    <div class="p-5 border-b border-slate-700">
      <div class="text-xs uppercase tracking-widest text-violet-400">Autonomous system diagnostic</div>
      <h2 class="text-2xl font-bold mt-1">Testing every selected component</h2>
      <p id="commissionStatus" class="text-sm text-slate-400 mt-2">Compiling the main project first…</p>
    </div>
    <div id="commissionRows" class="scroll max-h-[55vh] overflow-y-auto p-5 space-y-2"></div>
    <div class="p-4 border-t border-slate-700 flex justify-between items-center">
      <span class="text-xs text-slate-500">No repeated physical yes/no prompts are used.</span>
      <button id="commissionClose" disabled class="px-4 py-2 rounded-lg bg-slate-800 text-xs">Close</button>
    </div>
  </div>`;

  $("commissionClose").onclick=closeModal;
  renderCommissionRows();

  try{
    state.mainFirmware=await api("/compile",{cpp_code:$("codeEditor").value},200000);

    for(let i=0;i<state.selected.length;i++){
      await runCommissionTest(i);
    }

    $("commissionStatus").textContent="Restoring the main project firmware…";

    if(state.mainFirmware){
      try{
        await flashFirmware(state.mainFirmware,true);
      }catch(error){
        chat("doctor","Main project restore failed: "+error.message);
      }
    }

    state.commissioning=false;

    const failed=state.commissionResults.filter(x=>["FAILED","COMPILE_FAILED"].includes(x.status));
    const unknown=state.commissionResults.filter(x=>x.status==="UNKNOWN");

    $("commissionStatus").textContent=
      failed.length
        ? `${failed.length} component test(s) failed.`
        : unknown.length
          ? `Testing completed. ${unknown.length} component(s) could not be physically verified.`
          : "All component tests completed successfully.";

    $("commissionClose").disabled=false;
    $("commissionClose").textContent="Close report";

    chat(
      "doctor",
      failed.length
        ? `System diagnostic found ${failed.length} failing component(s).`
        : "System diagnostic completed without a detected component failure."
    );
  }catch(error){
    state.commissioning=false;
    $("commissionStatus").textContent="System diagnostic stopped: "+error.message;
    $("commissionClose").disabled=false;
    $("commissionClose").textContent="Close";
  }
}

function renderCommissionRows(){
  $("commissionRows").innerHTML=state.selected.map((component,index)=>{
    const result=state.commissionResults.find(x=>x.index===index);
    let status=result?.status||"QUEUED";
    let cls=status==="WORKING"?"text-emerald-300":status==="FAILED"?"text-red-300":status==="UNKNOWN"?"text-amber-300":"text-slate-500";

    return `<div class="rounded-xl border border-slate-800 bg-slate-900/60 p-4">
      <div class="flex justify-between gap-2">
        <div><div class="font-semibold">${esc(component.name)}</div><div class="text-[10px] text-slate-500">${esc(component.category_name||"Selected hardware")}</div></div>
        <span class="text-[10px] uppercase ${cls}">${esc(status)}</span>
      </div>
      ${result?`<div class="text-xs text-slate-300 mt-2">${esc(result.detail||"")}</div>`:""}
    </div>`;
  }).join("");
}

async function runCommissionTest(index){
  const component=state.selected[index];

  if(component.category_id==="microcontroller"){
    state.commissionResults.push({
      index,
      status:"WORKING",
      detail:"ESP32 controller accepted the project compilation."
    });
    componentStatus(component.id,"WORKING","Controller build verified.");
    renderCommissionRows();
    return;
  }

  $("commissionStatus").textContent=`Generating an isolated test for ${component.name}…`;

  let test;

  try{
    test=await api("/commission_code",{
      project:state.prompt,
      component,
      selected_components:state.selected
    },120000);
  }catch(error){
    state.commissionResults.push({index,status:"FAILED",detail:error.message});
    renderCommissionRows();
    return;
  }

  let compiled;

  try{
    compiled=await api("/compile",{cpp_code:test.cpp_code},200000);
  }catch(error){
    state.commissionResults.push({index,status:"COMPILE_FAILED",detail:error.message});
    renderCommissionRows();
    return;
  }

  state.serialLines=[];
  $("serialOutput").innerHTML="";

  try{
    await flashFirmware(compiled,false);
    await openSerial();
    await sleep(5500);
  }catch(error){
    state.commissionResults.push({index,status:"FAILED",detail:error.message});
    renderCommissionRows();
    return;
  }finally{
    await closeSerial();
  }

  const logs=state.serialLines.join("\n");

  let status="UNKNOWN";
  let detail="No explicit pass/fail evidence was captured.";

  if(marker(logs,"TEST_PASS",component.id)){
    status="WORKING";
    detail="The isolated test produced valid evidence.";
  }else if(marker(logs,"TEST_FAIL",component.id)){
    status="FAILED";
    detail="The isolated test reported a failure.";
  }else if(marker(logs,"TEST_UNKNOWN",component.id)){
    status="UNKNOWN";
    detail="The isolated test could not physically verify this component.";
  }else{
    try{
      const diagnosis=await api("/diagnose",{
        mode:"commissioning",
        project:state.prompt,
        cpp_code:test.cpp_code,
        compiler_error:"",
        serial_logs:logs,
        selected_components:[component],
        wiring:test.wiring||[],
        pin_map:[]
      },60000);
      status=diagnosis.fault_type==="HARDWARE"?"FAILED":diagnosis.fault_type==="SOFTWARE"?"WARNING":"UNKNOWN";
      detail=diagnosis.summary||diagnosis.user_message||detail;
    }catch(error){
      detail="Telemetry captured, but automatic interpretation was unavailable.";
    }
  }

  state.commissionResults.push({index,status,detail,logs});
  componentStatus(component.id,status,detail);
  renderCommissionRows();
}

$("generateBtn").onclick=startDesign;
$("troubleshootBtn").onclick=sendTroubleshoot;

$("troubleshootInput").addEventListener("keydown",event=>{
  if(event.key==="Enter"&&!event.shiftKey){
    event.preventDefault();
    sendTroubleshoot();
  }
});

$("clearChat").onclick=()=>$("chatLog").innerHTML="";
$("resetBtn").onclick=()=>location.reload();

$("connectBtn").onclick=async()=>{
  if(await selectPort())await openSerial();
};

if(navigator.serial){
  navigator.serial.addEventListener("disconnect",event=>{
    if(event.target===state.serialPort){
      state.serialOpen=false;
      $("serialStatus").textContent="disconnected";
      setConnection("● disconnected","text-slate-500");
    }
  });
}

$("projectPrompt").addEventListener("keydown",event=>{
  if((event.ctrlKey||event.metaKey)&&event.key==="Enter")startDesign();
});

health();
